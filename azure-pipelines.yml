trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:

# 1. Checkout source code
- checkout: self
  displayName: 'Checkout Source Code'
  fetchDepth: 0


# 2. Setup Python
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.8'
    addToPath: true
  displayName: 'Setup Python 3.8'


# 3. Upgrade pip
- script: |
    python -m pip install --upgrade pip
  displayName: 'Upgrade pip'


# 4. Install dependencies
- script: |
    python -m pip install -r requirement.txt
  displayName: 'Install Dependencies'


# 5. Install test dependencies
- script: |
    python -m pip install pytest pytest-html
  displayName: 'Install Test Dependencies'


# 6. Prepare SonarQube Cloud
- task: SonarCloudPrepare@4
  displayName: 'Prepare SonarQube Cloud Analysis'
  inputs:
    SonarCloud: 'SonarCloud-House-Project'
    organization: 'amala1602'
    scannerMode: 'cli'
    configMode: 'manual'
    cliProjectKey: 'House-Price-Prediction-3-'
    cliProjectName: 'House Price Prediction'
    cliSources: '.'
    extraProperties: |
      sonar.python.version=3.8
      sonar.exclusions=**/__pycache__/**,**/.pytest_cache/**,**/test-results/**


# 7. Compile Python modules
- script: |
    python -m py_compile app.py
    python -m py_compile house.py
  displayName: 'Compile Python Modules'


# 8. Create test results directory
- script: |
    mkdir -p test-results
  displayName: 'Create Test Results Directory'


# 9. Run tests
- script: |
    python -m pytest test_app_50_cases.py \
      -v \
      -ra \
      --junitxml=test-results/junit.xml \
      --html=test-results/unit-test-report.html \
      --self-contained-html
  displayName: 'Run 50 Unit Tests'
  continueOnError: true


# 10. Publish test results
- task: PublishTestResults@2
  condition: always()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: 'test-results/junit.xml'
    testRunTitle: 'House Price Prediction Unit Tests'
    failTaskOnFailedTests: false
  displayName: 'Publish Test Results'


# 11. Publish HTML test report
- task: PublishPipelineArtifact@1
  condition: always()
  inputs:
    targetPath: 'test-results'
    artifact: 'test-reports'
    publishLocation: 'pipeline'
  displayName: 'Publish Test Reports'


# 12. Run SonarQube Cloud analysis
- task: SonarCloudAnalyze@4
  displayName: 'Run SonarQube Cloud Analysis'
  inputs:
    jdkversion: 'JAVA_HOME_17_X64'


# 13. Publish Quality Gate
- task: SonarCloudPublish@4
  displayName: 'Publish SonarQube Quality Gate'
  inputs:
    pollingTimeoutSec: '300'